<style>
:root { --text:#1c1c1e; --leise:#5b5b60; --grund:#f3f5f4; --karte:#ffffff; --akzent:#0e7c66; --linie:#e1e5e3; --mark:#fff1a8; }
@media (prefers-color-scheme: dark) {
  :root { --text:#f2f2f7; --leise:#a3a3aa; --grund:#101312; --karte:#1b1f1e; --akzent:#4ac7a6; --linie:#2b3130; --mark:#5a4a00; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--grund); color:var(--text);
  font:17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust:100%; }
.seite { max-width:44rem; margin:0 auto; padding:0 16px; }
header { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:28px 0 0; }
header img { width:52px; height:52px; border-radius:12px; display:block; }
.marke { font-weight:700; font-size:22px; color:var(--text); text-decoration:none; }
nav { margin-left:auto; display:flex; gap:18px; font-size:15px; }
main { background:var(--karte); border:1px solid var(--linie); border-radius:16px; margin-top:20px; padding:6px 24px 24px; }
h1 { font-size:28px; line-height:1.2; margin:22px 0 10px; }
h2 { font-size:20px; line-height:1.3; margin:28px 0 8px; padding-top:20px; border-top:1px solid var(--linie); }
p { margin:0 0 14px; overflow-wrap:anywhere; }
a { color:var(--akzent); }
mark.offen { background:var(--mark); color:inherit; padding:0 4px; border-radius:4px; }
footer { display:flex; flex-wrap:wrap; gap:18px; color:var(--leise); font-size:14px; padding:18px 0 44px; }
@media (max-width:480px) {
  header img { width:44px; height:44px; border-radius:10px; }
  .marke { font-size:20px; }
  nav { gap:14px; }
  main { padding:2px 16px 18px; border-radius:12px; }
  h1 { font-size:25px; }
}
</style>
</head>
